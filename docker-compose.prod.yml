services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_internal
    mem_limit: 256m

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${FINANCE_DB_USER}:${FINANCE_DB_PASSWORD}@mysql:3306/${FINANCE_DB_NAME}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      finance_internal:
      platform_data:
      platform_edge:
        aliases:
          - finance-backend
    mem_limit: 512m

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      platform_edge:
        aliases:
          - finance-frontend
    mem_limit: 128m

volumes:
  redis_data:

networks:
  finance_internal:
  platform_edge:
    external: true
    name: platform_edge
  platform_data:
    external: true
    name: platform_data
